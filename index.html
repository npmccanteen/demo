<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meal System — Home</title>

<!-- PWA Meta -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c5aa0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal System">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #2c5aa0 0%, #1e4079 100%);
    min-height: 100vh; color: white;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .card {
    background: white; color: #222;
    border-radius: 16px; padding: 40px 30px;
    max-width: 480px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    text-align: center;
  }
  .logo { font-size: 48px; margin-bottom: 10px; }
  h1 { color: #2c5aa0; margin-bottom: 8px; font-size: 26px; }
  .sub { color: #666; margin-bottom: 30px; font-size: 14px; }

  .btn {
    display: block; width: 100%; padding: 15px;
    background: #2c5aa0; color: white; text-decoration: none;
    border-radius: 10px; font-weight: 600; margin-bottom: 12px;
    transition: 0.2s; font-size: 15px;
    text-align: center;
  }
  .btn:hover { background: #1e4079; transform: translateY(-1px); }
  .btn.secondary { background: #6c757d; }
  .btn.secondary:hover { background: #5a6268; }
  .btn.success { background: #28a745; }
  .btn.success:hover { background: #1e7e34; }
  .btn.dark { background: #1e4079; }
  .btn.dark:hover { background: #17325f; }

  .section-label {
    font-size: 11px; color: #999; text-align: left;
    margin: 20px 0 10px; text-transform: uppercase;
    letter-spacing: 1px; font-weight: 600;
  }

  .footer { margin-top: 25px; font-size: 12px; color: #999; }

  .pwa-badge {
    display: inline-block; margin-top: 15px;
    background: #e0e7ff; color: #3730a3;
    padding: 5px 12px; border-radius: 15px;
    font-size: 11px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🍽️</div>
    <h1>Meal System</h1>
    <p class="sub">Hostel Canteen Management</p>

    <div class="section-label">👤 Student</div>
    <a href="student-login.html" class="btn success">👤 Student Login</a>

    <div class="section-label">🛠️ Admin</div>
    <a href="admin/dashboard.html" class="btn dark">👥 Admin Dashboard</a>
    <a href="student-import.html" class="btn dark">📋 Student Import</a>
    <a href="sheet-generator.html" class="btn dark">📄 Sheet Generator</a>
    <a href="admin/pricing.html" class="btn dark">💰 Pricing Setup</a>
    <a href="canteen-scan.html" class="btn dark">📷 Canteen Scan</a>
    <a href="admin/backup.html" class="btn dark">💾 Backup & Restore</a>

    <div class="footer">Project: anando-ee1df</div>
  </div>

  <script type="module">
    import { initPWA, isInstalled } from './js/pwa.js';

    // Init PWA
    initPWA();

    // Show "already installed" badge
    if (isInstalled()) {
      const card = document.querySelector('.card');
      const badge = document.createElement('div');
      badge.className = 'pwa-badge';
      badge.textContent = '✅ Installed as App';
      card.appendChild(badge);
    }
  </script>
</body>
</html>
