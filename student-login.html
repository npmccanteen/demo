<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #2c5aa0 0%, #1e4079 100%);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px;
  }
  .card {
    background: white; border-radius: 16px; padding: 35px 30px;
    max-width: 420px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  h1 { color: #2c5aa0; font-size: 22px; margin-bottom: 6px; text-align: center; }
  .sub { color: #666; font-size: 13px; text-align: center; margin-bottom: 25px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 13px; color: #333; }
  input {
    width: 100%; padding: 12px 14px; border: 1.5px solid #ddd;
    border-radius: 8px; font-size: 15px; font-family: inherit; transition: 0.2s;
  }
  input:focus { border-color: #2c5aa0; outline: none; box-shadow: 0 0 0 3px rgba(44,90,160,0.1); }
  button {
    width: 100%; padding: 14px; background: #2c5aa0; color: white;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 20px; transition: 0.2s;
  }
  button:hover { background: #1e4079; }
  button:disabled { background: #999; cursor: not-allowed; }
  .msg {
    margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 13px;
    display: none; text-align: center;
  }
  .msg.show { display: block; }
  .msg.error { background: #fee; color: #721c24; border-left: 4px solid #dc3545; }
  .msg.ok { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
  .back-link {
    display: block; text-align: center; margin-top: 20px;
    color: #2c5aa0; text-decoration: none; font-size: 13px;
  }
  .back-link:hover { text-decoration: underline; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #fff; border-top-color: transparent;
    border-radius: 50%; animation: spin 1s linear infinite;
    margin-right: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h1>🎓 Student Login</h1>
  <p class="sub">Batch + Roll + Password দিয়ে login কর</p>

  <label>Batch Name</label>
  <input type="text" id="batchName" placeholder="যেমন: Batch A" />

  <label>Roll Number</label>
  <input type="text" id="roll" placeholder="যেমন: 101" />

  <label>Password</label>
  <input type="password" id="password" placeholder="পাসওয়ার্ড" />

  <button onclick="doLogin()" id="loginBtn">🔓 Login</button>
  <div class="msg" id="msg"></div>

  <a href="index.html" class="back-link">← Home</a>
</div>

<script type="module">
import {
  auth, signInWithEmailAndPassword, onAuthStateChanged
} from './js/firebase-init.js';

// Already logged in → dashboard
onAuthStateChanged(auth, user => {
  if (user) window.location.href = 'student-dashboard.html';
});

function makeEmail(batchName, roll) {
  const slug = batchName.toLowerCase().replace(/[^a-z0-9]/g, '');
  return `${slug}_${roll}@npmc.meal`.toLowerCase();
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.className = 'msg show ' + type;
  el.innerHTML = text;
}

window.doLogin = async function() {
  const batchName = document.getElementById('batchName').value.trim();
  const roll = document.getElementById('roll').value.trim();
  const password = document.getElementById('password').value;

  if (!batchName || !roll || !password) {
    return showMsg('⚠️ সব field পূরণ কর', 'error');
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Login হচ্ছে...';

  try {
    const email = makeEmail(batchName, roll);
    await signInWithEmailAndPassword(auth, email, password);
    showMsg('✅ Login সফল! Dashboard-এ যাচ্ছি...', 'ok');
    setTimeout(() => window.location.href = 'student-dashboard.html', 800);
  } catch (e) {
    console.error(e);
    let msg = e.message;
    if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
      msg = 'Batch / Roll / Password ভুল';
    } else if (e.code === 'auth/too-many-requests') {
      msg = 'অনেকবার try করা হয়েছে — কিছুক্ষণ পর try কর';
    } else if (e.code === 'auth/invalid-email') {
      msg = 'Batch Name বা Roll format ভুল';
    }
    showMsg('❌ ' + msg, 'error');
    btn.disabled = false;
    btn.textContent = '🔓 Login';
  }
};

// Enter key support
['batchName','roll','password'].forEach(id => {
  document.getElementById(id).addEventListener('keypress', e => {
    if (e.key === 'Enter') doLogin();
  });
});
</script>

</body>
</html>
