<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "e4831469-cbc3-4a4e-b970-6332a29690e0",
      safari_web_id: "web.onesignal.auto.13dd012d-81c7-44d8-8660-15690626d9c4",
      serviceWorkerPath: "OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/demo/" },
      notifyButton: { enable: false },
    });
  });
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e4079 0%, #2c5aa0 100%);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px;
  }
  .card {
    background: white; border-radius: 16px; padding: 38px 32px;
    max-width: 420px; width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .icon-big { text-align: center; font-size: 46px; margin-bottom: 8px; }
  h1 { color: #1e4079; font-size: 22px; margin-bottom: 6px; text-align: center; }
  .sub { color: #666; font-size: 13px; text-align: center; margin-bottom: 25px; }

  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 13px; color: #333; }
  input {
    width: 100%; padding: 13px 14px; border: 1.5px solid #ddd;
    border-radius: 8px; font-size: 15px; font-family: inherit; transition: 0.2s;
  }
  input:focus { border-color: #1e4079; outline: none; box-shadow: 0 0 0 3px rgba(30,64,121,0.1); }

  button {
    width: 100%; padding: 14px; background: #1e4079; color: white;
    border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 20px; transition: 0.2s;
  }
  button:hover { background: #17325f; }
  button:disabled { background: #999; cursor: not-allowed; }

  .msg {
    margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 13px;
    display: none; text-align: center;
  }
  .msg.show { display: block; }
  .msg.error { background: #fee; color: #721c24; border-left: 4px solid #dc3545; }
  .msg.ok { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
  .msg.info { background: #e7f3ff; color: #004085; border-left: 4px solid #2c5aa0; }

  .back-link {
    display: block; text-align: center; margin-top: 20px;
    color: #888; text-decoration: none; font-size: 13px;
  }
  .back-link:hover { color: #1e4079; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #fff; border-top-color: transparent;
    border-radius: 50%; animation: spin 1s linear infinite;
    margin-right: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .info-box {
    background: #f0f7ff; padding: 12px 16px; border-radius: 8px;
    margin-top: 20px; font-size: 12px; color: #004085; line-height: 1.7;
  }
  .info-box strong { color: #1e4079; }
</style>
</head>
<body>

<div class="card">
  <div class="icon-big">🔒</div>
  <h1>Admin Login</h1>
  <p class="sub">শুধু Admin-এর জন্য</p>

  <label>Email</label>
  <input type="email" id="email" placeholder="admin@example.com" autocomplete="email" />

  <label>Password</label>
  <input type="password" id="password" placeholder="••••••" autocomplete="current-password" />

  <button onclick="doLogin()" id="loginBtn">🔓 Login</button>
  <div class="msg" id="msg"></div>

  <div class="info-box">
    <strong>⚠️ প্রথমবার?</strong> Firebase Console → Authentication → Users → <strong>Add user</strong> দিয়ে admin account বানাস।
  </div>

  <a href="index.html" class="back-link">← Home</a>
</div>

<script type="module">
import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './js/firebase-init.js';

// If already logged in as admin → go to dashboard
onAuthStateChanged(auth, user => {
  if (user) {
    const redirect = sessionStorage.getItem('admin_redirect') || 'admin/dashboard.html';
    sessionStorage.removeItem('admin_redirect');
    window.location.replace(redirect);
  }
});

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.className = 'msg show ' + type;
  el.innerHTML = text;
}

window.doLogin = async function() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    return showMsg('⚠️ Email আর Password দুটোই দে', 'error');
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Login হচ্ছে...';

  try {
    await signInWithEmailAndPassword(auth, email, password);
    showMsg('✅ Login সফল! Dashboard-এ যাচ্ছি...', 'ok');

    const redirect = sessionStorage.getItem('admin_redirect') || 'admin/dashboard.html';
    sessionStorage.removeItem('admin_redirect');
    setTimeout(() => window.location.replace(redirect), 500);

  } catch (e) {
    console.error(e);
    let msg = e.message;
    if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
      msg = 'Email বা Password ভুল';
    } else if (e.code === 'auth/too-many-requests') {
      msg = 'অনেকবার চেষ্টা — কিছুক্ষণ পর try কর';
    } else if (e.code === 'auth/invalid-email') {
      msg = 'Email format সঠিক না';
    } else if (e.code === 'auth/operation-not-allowed') {
      msg = 'Firebase Console-এ Email/Password sign-in enable করা নেই';
    }
    showMsg('❌ ' + msg, 'error');
    btn.disabled = false;
    btn.textContent = '🔓 Login';
  }
};

['email','password'].forEach(id => {
  document.getElementById(id).addEventListener('keypress', e => {
    if (e.key === 'Enter') doLogin();
  });
});
</script>

</body>
</html>
